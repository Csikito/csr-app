<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BMS &amp; IT/OT – 12 hónapos program</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
:root {
  --bg:#f8fafc; --bg2:#f1f5f9; --card:#fff; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b; --subtle:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:10px; --radius-sm:7px; --tr:.15s ease;
  --accent-strong:#4f46e5; --accent-bg:#eef2ff; --accent-text:#3730a3;
  --g-dot:#1D9E75; --g-bg:#e8faf3; --g-text:#065f46; --g-border:#6ee7b7;
  --b-dot:#378ADD; --b-bg:#dbeafe; --b-text:#1e40af; --b-border:#93c5fd;
  --o-dot:#BA7517; --o-bg:#fef3c7; --o-text:#92400e; --o-border:#fcd34d;
  --r-dot:#D4554A; --r-bg:#fee2e2; --r-text:#991b1b; --r-border:#fca5a5;
  --check:#1D9E75;
}
[data-theme="dark"] {
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --border:#334155;
  --text:#f1f5f9; --muted:#94a3b8; --subtle:#475569;
  --shadow:0 1px 4px rgba(0,0,0,.4);
  --accent-bg:rgba(79,70,229,.22); --accent-text:#c7d2fe;
  --g-dot:#34d399; --g-bg:rgba(29,158,117,.15); --g-text:#6ee7b7; --g-border:rgba(29,158,117,.4);
  --b-dot:#60a5fa; --b-bg:rgba(55,138,221,.15); --b-text:#93c5fd; --b-border:rgba(55,138,221,.4);
  --o-dot:#fbbf24; --o-bg:rgba(186,117,23,.15); --o-text:#fcd34d; --o-border:rgba(186,117,23,.4);
  --r-dot:#f87171; --r-bg:rgba(212,85,74,.15); --r-text:#fca5a5; --r-border:rgba(212,85,74,.4);
  --check:#34d399;
}
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:20px; min-height:100vh; font-size:14px; line-height:1.5; transition:background var(--tr),color var(--tr); }
a { color:var(--b-text); }
button { font-family:inherit; font-size:inherit; color:inherit; }
code { font-family:Consolas,monospace; font-size:12px; background:var(--bg2); padding:1px 5px; border-radius:4px; }
input, textarea, select { font-family:inherit; font-size:13px; color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 10px; width:100%; transition:border-color var(--tr),box-shadow var(--tr); }
input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent-strong); box-shadow:0 0 0 3px var(--accent-bg); }
textarea { resize:vertical; min-height:70px; line-height:1.5; }
input[type=checkbox] { width:17px; height:17px; flex-shrink:0; margin-top:2px; accent-color:var(--check); cursor:pointer; padding:0; }
input[readonly], textarea[readonly] { background:var(--bg2); }

/* Fejléc */
.topbar { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.tb-title { font-size:16px; font-weight:700; }
.tb-goal { font-size:12.5px; color:var(--muted); margin-top:2px; max-width:680px; }
.tb-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.save-ind { font-size:11px; color:var(--check); opacity:0; transition:opacity .3s; }
.save-ind.show { opacity:1; }

/* Fülek */
.tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.tab { padding:8px 16px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); transition:all var(--tr); white-space:nowrap; }
.tab:hover { color:var(--text); border-color:var(--subtle); }
.tab.active { background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; box-shadow:0 2px 8px rgba(79,70,229,.3); }

/* Elrendezés */
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); }
.card.inner { box-shadow:none; background:var(--bg); }
.card-hd { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.card-hd > span:first-child { flex:1; }
.big { font-size:26px; font-weight:700; line-height:1.15; }
.muted { color:var(--muted); }
.small { font-size:12.5px; }
.mt8 { margin-top:8px; } .mt12 { margin-top:12px; } .mb12 { margin-bottom:12px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.spacer { flex:1; }
.sec-title { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:6px; }
.stat-rows > div { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
.stat-rows > div:last-child { border-bottom:none; }

/* Haladásjelző */
.bar { height:10px; background:var(--bg2); border:1px solid var(--border); border-radius:999px; overflow:hidden; }
.bar > span { display:block; height:100%; background:var(--check); border-radius:999px; transition:width .4s ease; }
.bar.lg { height:16px; }
.bar.sm { height:6px; }
.bar.warn > span { background:var(--o-dot); }
.hero { margin-bottom:12px; }
.hero .big { font-size:30px; }

/* Címkék, gombok */
.badge { display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--bg2); color:var(--muted); border:1px solid var(--border); white-space:nowrap; text-transform:none; letter-spacing:0; }
.badge.g { background:var(--g-bg); color:var(--g-text); border-color:var(--g-border); }
.badge.b { background:var(--b-bg); color:var(--b-text); border-color:var(--b-border); }
.badge.o { background:var(--o-bg); color:var(--o-text); border-color:var(--o-border); }
.badge.r { background:var(--r-bg); color:var(--r-text); border-color:var(--r-border); }
.badge.a { background:var(--accent-bg); color:var(--accent-text); border-color:transparent; }
button.badge { cursor:pointer; }
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:12.5px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); transition:all var(--tr); text-decoration:none; white-space:nowrap; }
.btn:hover { border-color:var(--subtle); }
.btn:disabled { opacity:.45; cursor:default; }
.btn.primary { background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
.btn.primary:hover { filter:brightness(1.08); }
.btn.danger { color:var(--r-text); border-color:var(--r-border); background:var(--r-bg); }
.btn.sm { padding:4px 11px; font-size:12px; }
.icon-btn { border:none; background:none; color:var(--subtle); font-size:18px; line-height:1; cursor:pointer; padding:2px 7px; border-radius:6px; flex-shrink:0; }
.icon-btn:hover { color:var(--r-dot); background:var(--r-bg); }

/* Kiemelő dobozok */
.callout { font-size:12.5px; padding:10px 14px; border-left:3px solid var(--b-dot); background:var(--b-bg); color:var(--b-text); border-radius:0 var(--radius-sm) var(--radius-sm) 0; line-height:1.55; }
.callout.g { border-color:var(--g-dot); background:var(--g-bg); color:var(--g-text); }
.callout.o { border-color:var(--o-dot); background:var(--o-bg); color:var(--o-text); }
.callout.r { border-color:var(--r-dot); background:var(--r-bg); color:var(--r-text); }
.callout b { font-weight:700; }
.cloud-warn { margin-bottom:14px; }

/* Hónapkártyák */
.mcards { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; margin-bottom:16px; }
.mcard { text-align:left; background:var(--card); border:1px solid var(--border); border-top:3px solid var(--border); border-radius:var(--radius); padding:11px 12px; cursor:pointer; box-shadow:var(--shadow); transition:all var(--tr); display:flex; flex-direction:column; gap:6px; }
.mcard:hover { border-color:var(--subtle); }
.mcard.prog { border-top-color:var(--b-dot); }
.mcard.done { border-top-color:var(--g-dot); }
.mcard.active { border-color:var(--accent-strong); box-shadow:0 0 0 3px var(--accent-bg); }
.mc-top { display:flex; justify-content:space-between; align-items:center; gap:6px; }
.mc-num { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
.mc-title { font-size:13.5px; font-weight:700; line-height:1.3; }
.mc-foot { font-size:11px; color:var(--muted); }

/* Hónap- és hétnézet */
.md-title { font-size:17px; font-weight:700; }
.md-goal { color:var(--muted); margin-top:2px; }
.res-list { list-style:none; display:flex; flex-direction:column; gap:3px; font-size:13px; }
.res-list li::before { content:'📘 '; }
.wtabs { display:flex; gap:6px; flex-wrap:wrap; margin:16px 0 12px; }
.wtab { padding:7px 16px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; box-shadow:var(--shadow); transition:all var(--tr); }
.wtab:hover { color:var(--text); border-color:var(--subtle); }
.wtab.active { background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
.wp-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.wp-title { font-size:15px; font-weight:700; }
.wp-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.topics { padding-left:18px; font-size:13px; }
.topics li { margin:2px 0; }
.qs { padding-left:20px; font-size:13px; }
.qs li { margin:3px 0; }
details summary { cursor:pointer; font-weight:600; font-size:13px; }
.task-row { display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); cursor:pointer; }
.task-row:last-child { border-bottom:none; }
.task-row.done .task-txt { color:var(--muted); text-decoration:line-through; }
.task-txt { font-size:13px; line-height:1.5; }
.task-line { display:flex; align-items:flex-start; gap:4px; border-bottom:1px solid var(--border); }
.task-line .task-row { flex:1; border-bottom:none; }
.ro input[type=checkbox] { opacity:.55; }
.time-list { list-style:none; margin-top:6px; }
.time-list li { display:flex; justify-content:space-between; align-items:center; font-size:12.5px; padding:3px 0; border-bottom:1px dashed var(--border); }

/* Diagram */
.chart-area { position:relative; height:120px; display:flex; align-items:flex-end; gap:6px; border-bottom:1px solid var(--border); }
.chart-col { flex:1; height:100%; display:flex; align-items:flex-end; }
.chart-col span { display:block; width:100%; min-height:2px; background:var(--b-dot); border-radius:4px 4px 0 0; opacity:.85; }
.chart-col.cur span { background:var(--accent-strong); opacity:1; }
.target-line { position:absolute; left:0; right:0; border-top:1px dashed var(--o-dot); pointer-events:none; }
.chart-labels { display:flex; gap:6px; margin-top:4px; }
.chart-labels div { flex:1; text-align:center; font-size:10px; color:var(--muted); }

/* Időbeosztás */
.table-wrap { overflow-x:auto; }
table.sched { width:100%; border-collapse:collapse; min-width:520px; }
table.sched th, table.sched td { padding:6px 8px; border-bottom:1px solid var(--border); text-align:left; font-size:13px; }
table.sched th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
table.sched input { padding:5px 8px; }
table.sched td.day { font-weight:600; white-space:nowrap; }

/* Munkahelyi napló */
.wl-form { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.wl-form .full { grid-column:1 / -1; }
.wl-form label { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; display:flex; flex-direction:column; gap:4px; }
.wl-card { margin-bottom:10px; }
.wl-card h4 { font-size:14px; }
.wl-sec { margin-top:8px; }
.wl-sec b { font-size:11px; text-transform:uppercase; color:var(--muted); letter-spacing:.05em; display:block; }
.wl-sec p { white-space:pre-wrap; font-size:13px; }

/* Havi értékelés */
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { padding:5px 11px; border-radius:999px; border:1px solid var(--border); background:var(--card); font-size:12px; font-weight:600; cursor:pointer; color:var(--muted); }
.chip:hover { color:var(--text); border-color:var(--subtle); }
.chip.active { background:var(--accent-strong); border-color:var(--accent-strong); color:#fff; }
.q-label { font-weight:600; font-size:13px; margin-bottom:4px; display:block; }

/* Keresés */
.search-banner { font-size:12px; color:var(--muted); background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 12px; margin-bottom:14px; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
.s-item { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:8px; cursor:pointer; box-shadow:var(--shadow); }
.s-item:hover { border-color:var(--subtle); }
mark { background:rgba(250,204,21,.4); color:inherit; border-radius:2px; padding:0 1px; }
[data-theme="dark"] mark { background:rgba(250,204,21,.22); }

/* Értesítés */
.toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(20px); background:#1e293b; color:#fff; padding:9px 16px; border-radius:999px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:all .25s; z-index:50; max-width:calc(100% - 32px); text-align:center; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width: 767px) {
  body { padding:12px; }
  .tabs { flex-wrap:nowrap; overflow-x:auto; padding-bottom:4px; }
  .tab { flex:0 0 auto; }
  .wp-grid, .wl-form { grid-template-columns:1fr; }
  .mcards { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .hero .big { font-size:24px; }
}
</style>
</head>

      '<div class="callout r">Hibás tananyag-adat (program-data JSON): ' + String(err.message).replace(/[<>&]/g, '') + '</div>';
    return;
  }
  const META = PROGRAM.meta;
  const MONTHS = PROGRAM.months;
  const WEEKS = [];
  MONTHS.forEach((m, mi) => m.weeks.forEach((_, wi) => WEEKS.push({ mi, wi })));

  const OWNER_EMAIL = 'xlopojackx@gmail.com';
  const LS_KEY = 'bms_itot_state_v1';
  const DB_PATH = 'bms_itot_12honap';
  const TECHS = ['BACnet', 'Modbus', 'OPC UA', 'S7 / PROFINET', 'MQTT', 'Hálózat / routing', 'Tűzfal / VPN', 'Szerver / OS', 'Egyéb'];
  const NOTE_PH = 'Mit tanultam?\nMit értettem meg?\nMi nem világos?\nMilyen kérdéseim vannak?\nMilyen munkahelyi problémával találkoztam?\nMilyen megoldást találtam?';
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  /* ================= Segédfüggvények ================= */
  const $ = (sel) => document.querySelector(sel);
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  let currentQuery = '';
  function hl(s) {
    s = String(s == null ? '' : s);
    if (!currentQuery) return esc(s);
    const q = currentQuery.toLowerCase();
    const low = s.toLowerCase();
    if (low.length !== s.length) return esc(s);
    let out = '', i = 0, j;
    while ((j = low.indexOf(q, i)) !== -1) {
      out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>';
      i = j + q.length;
    }
    return out + esc(s.slice(i));
  }
  function fmtMin(m) {
    m = Math.max(0, Math.round(Number(m) || 0));
    const h = Math.floor(m / 60), r = m % 60;
    if (!h) return r + ' p';
    return r ? h + ' ó ' + r + ' p' : h + ' ó';
  }
  function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function wk(mi, wi) { return 'm' + mi + 'w' + wi; }
  function parseWeekKey(k) {
    const m = /^m(\d+)w(\d+)$/.exec(String(k || ''));
    if (!m) return null;
    const mi = +m[1], wi = +m[2];
    return MONTHS[mi] && MONTHS[mi].weeks[wi] ? { mi, wi } : null;
  }
  function ymd(dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
  function todayStr() { return ymd(new Date()); }
  function parseYmd(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { const dt = parseYmd(s); dt.setDate(dt.getDate() + n); return ymd(dt); }
  function weekStartStr(s) { const dt = parseYmd(s); dt.setDate(dt.getDate() - ((dt.getDay() + 6) % 7)); return ymd(dt); }
  const isObj = (v) => !!v && typeof v === 'object' && !Array.isArray(v);
  const obj = (v) => (isObj(v) ? v : {});
  function valToArr(v) { if (!v) return []; return Array.isArray(v) ? v : Object.values(v); }

  /* ================= Állapot ================= */
  function emptyState() {
    return { v: 1, tasks: {}, custom: {}, notes: {}, time: {}, worklog: {}, reviews: {}, schedule: null, pinnedWeek: null, building: '', updatedAt: 0 };
  }
  function normalize(raw) {
    const r = obj(raw), s = emptyState();
    Object.entries(obj(r.tasks)).forEach(([k, v]) => { if (v === true) s.tasks[k] = true; });
    Object.entries(obj(r.custom)).forEach(([wkKey, list]) => {
      const out = {};
      Object.entries(obj(list)).forEach(([id, c]) => { if (isObj(c) && c.text) out[id] = { text: String(c.text), done: !!c.done }; });
      if (Object.keys(out).length) s.custom[wkKey] = out;
    });
    Object.entries(obj(r.notes)).forEach(([k, v]) => { if (typeof v === 'string' && v) s.notes[k] = v; });
    Object.entries(obj(r.time)).forEach(([id, t]) => {
      if (isObj(t) && DATE_RE.test(t.date) && Number(t.min) > 0) {
        s.time[id] = { date: t.date, min: Math.round(Number(t.min)), week: typeof t.week === 'string' ? t.week : '' };
      }
    });
    Object.entries(obj(r.worklog)).forEach(([id, e]) => {
      if (!isObj(e)) return;
      s.worklog[id] = {
        date: DATE_RE.test(e.date) ? e.date : todayStr(),
        title: String(e.title || ''), tech: String(e.tech || ''), week: String(e.week || ''),
        problem: String(e.problem || ''), cause: String(e.cause || ''), solution: String(e.solution || ''), lesson: String(e.lesson || '')
      };
    });
    Object.entries(obj(r.reviews)).forEach(([k, ans]) => {
      const out = {};
      Object.entries(obj(ans)).forEach(([qk, v]) => { if (typeof v === 'string' && v) out[qk] = v; });
      if (Object.keys(out).length) s.reviews[k] = out;
    });
    const sch = valToArr(r.schedule).filter(isObj);
    if (sch.length === 7) {
      s.schedule = sch.map((x) => ({ day: String(x.day || ''), label: String(x.label || ''), min: Math.max(0, parseInt(x.min, 10) || 0), time: String(x.time || '') }));
    }
    s.pinnedWeek = parseWeekKey(r.pinnedWeek) ? r.pinnedWeek : null;
    s.building = typeof r.building === 'string' ? r.building : '';
    s.updatedAt = Number(r.updatedAt) || 0;
    return s;
  }
  let state = emptyState();

  const ui = {
    view: 'overview', month: null, week: 0, reviewMonth: null,
    wlEditing: null, wlFilter: '', confirm: null,
    importPreview: null, importError: null, searchDismissed: false, qOpen: false
  };

  /* ================= Számítások ================= */
  function mandatoryItems(mi, wi) {
    const w = MONTHS[mi].weeks[wi], k = wk(mi, wi);
    return [{ key: k + '-t', text: META.theoryTask }].concat(w.practice.map((t, i) => ({ key: k + '-p' + i, text: t })));
  }
  function optionalItems(mi, wi) {
    const w = MONTHS[mi].weeks[wi], k = wk(mi, wi);
    const items = [];
    if (w.work) items.push({ key: k + '-w', text: 'Munkahelyi kapcsolódás: ' + w.work });
    (w.extra || []).forEach((t, i) => items.push({ key: k + '-x' + i, text: t }));
    items.push({ key: k + '-q', text: META.selfCheckTask });
    items.push({ key: k + '-e', text: META.englishTask });
    return items;
  }
  const isChecked = (key) => !!state.tasks[key];
  function weekCounts(mi, wi) {
    const items = mandatoryItems(mi, wi);
    return { done: items.filter((it) => isChecked(it.key)).length, total: items.length };
  }
  function weekDone(mi, wi) { const c = weekCounts(mi, wi); return c.done === c.total; }
  function monthPct(mi) {
    let done = 0, total = 0;
    MONTHS[mi].weeks.forEach((_, wi) => { const c = weekCounts(mi, wi); done += c.done; total += c.total; });
    return total ? Math.round((done / total) * 100) : 0;
  }
  function monthStatus(mi) {
    const p = monthPct(mi);
    return p === 0 ? ['Nem kezdett', ''] : p === 100 ? ['Kész', 'g'] : ['Folyamatban', 'b'];
  }
  const completedWeeks = () => WEEKS.filter((x) => weekDone(x.mi, x.wi)).length;
  const totalMandatory = () => WEEKS.reduce((s, x) => s + weekCounts(x.mi, x.wi).total, 0);
  const doneMandatory = () => WEEKS.reduce((s, x) => s + weekCounts(x.mi, x.wi).done, 0);
  const englishWeeks = () => WEEKS.filter((x) => isChecked(wk(x.mi, x.wi) + '-e')).length;
  const totalMinutes = () => Object.values(state.time).reduce((s, t) => s + t.min, 0);

  // Aktuális hét: a kitűzött hét (vagy az utána következő első be nem fejezett), különben az első be nem fejezett.
  function currentWeek() {
    const p = parseWeekKey(state.pinnedWeek);
    if (p) {
      const idx = WEEKS.findIndex((x) => x.mi === p.mi && x.wi === p.wi);
      for (let i = idx; i < WEEKS.length; i++) {
        const x = WEEKS[i];
        if (!weekDone(x.mi, x.wi)) return { mi: x.mi, wi: x.wi, pinned: i === idx };
      }
    }
    const f = WEEKS.find((x) => !weekDone(x.mi, x.wi));
    return f ? { mi: f.mi, wi: f.wi, pinned: false } : { mi: 11, wi: 3, pinned: false, allDone: true };
  }
  function nextTask(mi, wi) {
    const m = mandatoryItems(mi, wi).find((it) => !isChecked(it.key));
    if (m) return m.text;
    const o = optionalItems(mi, wi).find((it) => !isChecked(it.key));
    return o ? 'Opcionális – ' + o.text : 'Ez a hét kész ✓';
  }
  function targetFor(mi, wi) {
    return MONTHS[mi].weeks[wi].light ? { lo: 120, hi: 180, label: '2–3 ó' } : { lo: 300, hi: 420, label: '5–7 ó' };
  }
  function defaultWeekFor(mi) {
    const cw = currentWeek();
    if (cw.mi === mi) return cw.wi;
    const f = MONTHS[mi].weeks.findIndex((_, wi) => !weekDone(mi, wi));
    return f === -1 ? 0 : f;
  }
  function minutesByWeek() {
    const map = {};
    Object.values(state.time).forEach((t) => { const ws = weekStartStr(t.date); map[ws] = (map[ws] || 0) + t.min; });
    return map;
  }
  function worklogWeeks() {
    const set = new Set();
    Object.values(state.worklog).forEach((e) => { if (DATE_RE.test(e.date)) set.add(weekStartStr(e.date)); });
    return set;
  }
  const isKept = (ws, mins, wlw) => (mins[ws] || 0) >= 60 || wlw.has(ws);
  // Sorozat: egymást követő „megtartott” naptári hetek. A folyamatban lévő hét nem szakítja meg.
  function streak(mins, wlw) {
    let ws = weekStartStr(todayStr());
    let n = isKept(ws, mins, wlw) ? 1 : 0;
    ws = addDays(ws, -7);
    let guard = 0;
    while (isKept(ws, mins, wlw) && guard++ < 600) { n++; ws = addDays(ws, -7); }
    return n;
  }

  /* ================= Mentés (localStorage + Firebase) ================= */
  let isOwner = false;
  let localNewer = false;
  let cloudError = false;
  let cloudReadError = false;
  let remoteTimer = null;
  let dbRef = null, auth = null;

  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* nem elérhető */ } }
  function loadLocal() {
    try { const s = localStorage.getItem(LS_KEY); return s ? normalize(JSON.parse(s)) : null; } catch (e) { return null; }
  }
  function showSaveInd() {
    const ind = $('#saveInd');
    ind.classList.add('show');
    clearTimeout(showSaveInd.t);
    showSaveInd.t = setTimeout(() => ind.classList.remove('show'), 1500);
  }
  function withAuth(fn) {
    if (!auth) return;
    if (auth.currentUser) { fn(); return; }
    const unsub = auth.onAuthStateChanged((u) => { unsub(); if (u && u.email === OWNER_EMAIL) fn(); });
  }
  function pushRemote() {
    if (!dbRef || !isOwner) return;
    const payload = JSON.parse(JSON.stringify(state));
    withAuth(() => {
      dbRef.set(payload).then(() => {
        if (cloudError) { cloudError = false; renderCloudWarn(); }
        showSaveInd();
      }).catch((err) => {
        console.error('Firebase save error:', err && err.code, err && err.message);
        cloudError = true;
        renderCloudWarn();
      });
    });
  }
  function commit(immediate) {
    if (!isOwner) return false;
    state.updatedAt = Date.now();
    saveLocal();
    if (!dbRef) { showSaveInd(); return true; }
    clearTimeout(remoteTimer);
    remoteTimer = setTimeout(pushRemote, immediate ? 0 : 800);
    return true;
  }
  function load() {
    const local = loadLocal();
    if (local) state = local;
    render();
    if (!dbRef) return;
    dbRef.get().then((snap) => {
      cloudReadError = false;
      if (snap.exists()) {
        const remote = normalize(snap.val());
        if (remote.updatedAt >= state.updatedAt) { state = remote; saveLocal(); localNewer = false; }
        else localNewer = true;
      } else {
        localNewer = !!(local && local.updatedAt > 0);
      }
      if (localNewer && isOwner) { localNewer = false; pushRemote(); }
      render();
    }).catch((err) => {
      console.warn('Firebase read error:', err && err.message);
      cloudReadError = true;
      renderCloudWarn();
    });
  }
  function setOwner(v) {
    v = !!v;
    if (v === isOwner) return;
    isOwner = v;
    document.body.classList.toggle('ro', !isOwner);
    if (isOwner && localNewer) { localNewer = false; pushRemote(); }
    render();
  }
  function requireOwner() {
    if (isOwner) return true;
    toast('Szerkesztéshez jelentkezz be (főoldal → Bejelentkezés).');
    return false;
  }
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ================= Megjelenítés ================= */
  function renderTopbar() {
    $('#tbGoal').textContent = '🎯 12 hónapos cél: ' + META.goal12;
    let b = '';
    if (!dbRef) b = '<span class="badge o">Helyi mód</span>';
    else if (!isOwner) b = '<span class="badge">👁 Csak olvasás</span>';
    $('#tbBadges').innerHTML = b;
  }
  function renderCloudWarn() {
    const el = $('#cloudWarn');
    let msg = '';
    if (!dbRef) msg = 'Helyi mód: a Firebase nem töltődött be, ezért a változások csak ebben a böngészőben mentődnek. Ha legközelebb elérhető, és be vagy jelentkezve, a helyi adatok feltöltődnek.';
    else if (cloudError) msg = '<b>A felhőbe mentés nem sikerült.</b> Az adataid ebben a böngészőben megvannak. Valószínű ok: a Firebase-szabályok nem engedik írni a <code>' + DB_PATH + '</code> ágat (Firebase-konzol → Realtime Database → Rules).';
    else if (cloudReadError) msg = 'A felhőből olvasás nem sikerült – a helyben tárolt adatokat látod.';
    el.innerHTML = msg;
    el.hidden = !msg;
  }
  function renderSearchBanner(searching) {
    const el = $('#searchBanner');
    if (!currentQuery) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = searching
      ? '<span>🔍 Keresés: „' + esc(currentQuery) + '”</span><button class="btn sm" data-action="search-dismiss">Vissza a nézethez</button>'
      : '<span>🔍 „' + esc(currentQuery) + '” kiemelve</span><button class="btn sm" data-action="search-show">Találatok</button>';
  }

  const VIEWS = ['overview', 'program', 'schedule', 'worklog', 'review', 'data', 'search'];
  function render() {
    renderTopbar();
    renderCloudWarn();
    const searching = !!currentQuery && !ui.searchDismissed;
    document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', !searching && b.dataset.view === ui.view));
    VIEWS.forEach((v) => { $('#view-' + v).hidden = searching ? v !== 'search' : v !== ui.view; });
    renderSearchBanner(searching);
    if (searching) { renderSearch(); return; }
    RENDERERS[ui.view]();
  }

  function chartHtml(mins) {
    const ws0 = weekStartStr(todayStr());
    const weeks = [];
    for (let i = 7; i >= 0; i--) weeks.push(addDays(ws0, -7 * i));
    const max = Math.max(420, ...weeks.map((x) => mins[x] || 0));
    const cols = weeks.map((x) => {
      const v = mins[x] || 0;
      return '<div class="chart-col' + (x === ws0 ? ' cur' : '') + '" title="' + x + ': ' + fmtMin(v) + '"><span style="height:' + Math.round((v / max) * 100) + '%"></span></div>';
    }).join('');
    const labels = weeks.map((x) => '<div>' + x.slice(5).replace('-', '.') + '</div>').join('');
    return '<div class="chart-area">' + cols + '<div class="target-line" style="bottom:' + Math.round((300 / max) * 100) + '%"></div></div><div class="chart-labels">' + labels + '</div>';
  }

  function renderOverview() {
    const done = completedWeeks();
    const pct = Math.round((done / WEEKS.length) * 100);
    const cw = currentWeek();
    const m = MONTHS[cw.mi], w = m.weeks[cw.wi];
    const mins = minutesByWeek();
    const wlw = worklogWeeks();
    const ws = weekStartStr(todayStr());
    const thisWeek = mins[ws] || 0;
    const tgt = targetFor(cw.mi, cw.wi);

    const tPct = Math.min(100, Math.round((thisWeek / tgt.lo) * 100));

    $('#view-overview').innerHTML = `
      <div class="card hero">

        <div class="row"><div class="big">${pct}%</div>
          <div class="small muted">Teljesített hetek: <b>${done}</b> · Hátralévő: <b>${WEEKS.length - done}</b> · Kötelező feladatok: <b>${doneMandatory()} / ${totalMandatory()}</b></div></div>
        <div class="bar lg mt8"><span style="width:${pct}%"></span></div>
      </div>
      <div class="grid">
        <div class="card">
          <div class="card-hd"><span>Aktuális hét</span>${cw.pinned ? '<span class="badge o">📌 Kitűzve</span>' : ''}${w.light ? '<span class="badge g">Könnyített</span>' : ''}</div>
          <div class="small muted">${cw.mi + 1}. hónap · ${cw.wi + 1}. hét · ${esc(m.short)}</div>
          <div style="font-weight:700;font-size:15px;margin-top:2px">${esc(w.title)}</div>
          <div class="small mt8">${esc(w.goal)}</div>
          <div class="callout mt12"><b>Következő feladat:</b> ${esc(nextTask(cw.mi, cw.wi))}</div>
          <div class="row mt12"><button class="btn primary" data-action="open-week" data-mi="${cw.mi}" data-wi="${cw.wi}">Megnyitás →</button></div>
        </div>
        <div class="card">
          <div class="card-hd"><span>Ezen a héten</span><span class="badge">cél: ${tgt.label}</span></div>
          <div class="big">${fmtMin(thisWeek)}</div>
          <div class="bar mt8${thisWeek < tgt.lo ? ' warn' : ''}"><span style="width:${tPct}%"></span></div>
          <div class="small muted mt8">Gyors rögzítés az aktuális hétre:</div>
          <div class="row mt8">
            <button class="btn sm" data-action="log-time" data-min="15">+15 p</button>
            <button class="btn sm" data-action="log-time" data-min="30">+30 p</button>
            <button class="btn sm" data-action="log-time" data-min="60">+1 ó</button>
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><span>Sorozat</span>${kept ? '<span class="badge g">Ez a hét megtartva ✓</span>' : '<span class="badge">Ez a hét még nincs meg</span>'}</div>
          <div class="big">🔥 ${streak(mins, wlw)} hét</div>
          <div class="small muted mt8">${esc(META.minimumRule)}</div>
        </div>
      </div>
      <div class="grid mt12">
        <div class="card">
          <div class="card-hd"><span>Statisztika</span></div>
          <div class="stat-rows">
            <div><span>Összes tanulási idő</span><b>${fmtMin(totalMinutes())}</b></div>
            <div><span>Munkahelyi napló</span><b>${Object.keys(state.worklog).length} bejegyzés</b></div>
            <div><span>Angol hetek</span><b>${englishWeeks()}</b></div>
            <div><span>Kész hónapok</span><b>${MONTHS.filter((_, i) => monthPct(i) === 100).length} / ${MONTHS.length}</b></div>
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><span>Tanulási idő – utolsó 8 hét</span><span class="small muted" style="text-transform:none;letter-spacing:0">szaggatott vonal: 5 ó</span></div>
          ${chartHtml(mins)}
        </div>
        <div class="card">
          <div class="card-hd"><span>Irány</span></div>
          <div><b>🎯 ${esc(META.goal12)}</b></div>
          <div class="small muted mt8">${esc(META.longTerm)}</div>
          <div class="sec-title mt12">Referencia-épület</div>
          <div class="small">${bShort ? esc(bShort).replace(/\n/g, '<br>') : '<span class="muted">Még nincs megadva – az Adatok fülön írhatod le.</span>'}</div>
        </div>
      </div>`;
  }

  function taskRow(item) {
    const c = isChecked(item.key);
    return '<label class="task-row' + (c ? ' done' : '') + '"><input type="checkbox" data-task="' + esc(item.key) + '"' + (c ? ' checked' : '') + '><span class="task-txt">' + hl(item.text) + '</span></label>';
  }

  function renderProgram() {
    const cw = currentWeek();
    if (ui.month == null) { ui.month = cw.mi; ui.week = cw.wi; }
    const mi = ui.month, m = MONTHS[mi];
    if (!(ui.week >= 0 && ui.week < m.weeks.length)) ui.week = 0;
    const wi = ui.week;
    const cards = MONTHS.map((mm, i) => {
      const pct = monthPct(i);
      const st = monthStatus(i);
      const cls = 'mcard' + (pct === 100 ? ' done' : pct > 0 ? ' prog' : '') + (i === mi ? ' active' : '');
      return `<button class="${cls}" data-action="sel-month" data-mi="${i}">
          <div class="mc-top"><span class="mc-num">${i + 1}. hónap</span><span class="badge ${st[1]}">${st[0]}</span></div>
          <div class="mc-title">${hl(mm.short)}</div>
          <div class="bar sm"><span style="width:${pct}%"></span></div>
          <div class="mc-foot">${pct}% · ${mm.weeks.length} hét${cw.mi === i ? ' · <b>aktuális</b>' : ''}</div>
        </button>`;
    }).join('');
    const wtabs = m.weeks.map((_, j) => {
      const isCur = cw.mi === mi && cw.wi === j;
      return `<button class="wtab${j === wi ? ' active' : ''}" data-action="sel-week" data-wi="${j}">${j + 1}. hét${weekDone(mi, j) ? ' ✓' : ''}${isCur ? ' •' : ''}</button>`;
    }).join('');
    const res = (m.resources || []).map((r) => (r.u
      ? '<li><a href="' + esc(r.u) + '" target="_blank" rel="noopener">' + hl(r.t) + '</a></li>'

  function scheduleRows() { return state.schedule || META.defaultSchedule; }

          <div class="row mt12"><button class="btn sm" data-action="wl-edit" data-id="${esc(id)}">Szerkesztés</button><button class="btn sm danger" data-action="wl-del" data-id="${esc(id)}">${confirming ? 'Biztos? Kattints újra' : 'Törlés'}</button></div>
        </div>`;
    }).join('');
    $('#view-worklog').innerHTML = `
      <div class="row mb12">
        <button class="btn primary" data-action="wl-new">＋ Új bejegyzés</button>
        <span class="spacer"></span>

        <span class="small muted">${filtered.length} bejegyzés</span>

      ${form}
      ${list || '<div class="card small muted">Még nincs bejegyzés. Minden valós munkahelyi probléma ide kerül – ez a legjobb tananyagod, és egy bejegyzéssel a „minimum hét” is teljesül.</div>'}`;

  function renderReview() {
    if (ui.reviewMonth == null) ui.reviewMonth = currentWeek().mi;

        ${META.reviewQuestions.map((q, i) => `<div class="mt12"><label class="q-label" for="rq${i}">${i + 1}. ${esc(q)}</label><textarea id="rq${i}" data-review="${mi}:${i}" rows="3"${ro}>${esc(ans['q' + i] || '')}</textarea></div>`).join('')}
        <div class="row mt12"><span class="spacer"></span>${mi < MONTHS.length - 1 ? '<button class="btn primary" data-action="review-next">Tovább a ' + (mi + 2) + '. hónapra →</button>' : ''}</div>

    return Object.keys(s.tasks).length + ' pipa, ' + Object.keys(s.notes).length + ' jegyzet, ' + Object.keys(s.time).length + ' időbejegyzés, ' +

  function renderData() {
    const ro = isOwner ? '' : ' readonly';
    const p = ui.importPreview;
    $('#view-data').innerHTML = `
      <div class="grid">
        <div class="card">
          <div class="card-hd"><span>Referencia-épület</span></div>
          <div class="small muted">Ezen az épületen dolgozol egész évben; minden havi eredmény ennek egy fejezete.</div>
          <textarea class="mt8" data-building rows="8" placeholder="${esc(META.buildingDefault)}" aria-label="Referencia-épület leírása"${ro}>${esc(state.building)}</textarea>
        </div>
        <div class="card">
          <div class="card-hd"><span>Mentés és visszatöltés</span></div>

            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
          ${ui.importError ? '<div class="callout r mt12">Az importálás nem sikerült: ' + esc(ui.importError) + '</div>' : ''}
          ${p ? '<div class="callout o mt12"><b>Felülírod a jelenlegi adatokat?</b><br>Az importált fájlban: ' + counts(p) + '.<div class="row mt8"><button class="btn primary sm" data-action="import-confirm">Igen, importálom</button><button class="btn sm" data-action="import-cancel">Mégse</button></div></div>' : ''}
          <div class="small muted mt12">Tárolás: Firebase (<code>${DB_PATH}</code>) + helyi másolat ebben a böngészőben. A régi 24 hónapos checklist adatait ez az oldal nem érinti.</div>

          <button class="btn danger sm" data-action="reset-all">${ui.confirm === 'reset' ? 'Biztos? Kattints újra' : 'Minden adat törlése'}</button></div>
      </div>`;
  }

  function snippet(text, q) {
    const i = text.toLowerCase().indexOf(q);
    if (i < 0) return text.slice(0, 120);
    const a = Math.max(0, i - 50), b = Math.min(text.length, i + q.length + 70);
    return (a > 0 ? '…' : '') + text.slice(a, b) + (b < text.length ? '…' : '');
  }
  function searchResults() {
    const q = currentQuery.toLowerCase();
    const has = (t) => String(t || '').toLowerCase().includes(q);
    const res = { months: [], weeks: [], wl: [] };
    MONTHS.forEach((m, mi) => {
      if ([m.title, m.short, m.goal, m.output, m.checkpoint].concat((m.resources || []).map((r) => r.t)).some(has)) res.months.push(mi);
    });
    WEEKS.forEach(({ mi, wi }) => {
      const w = MONTHS[mi].weeks[wi], k = wk(mi, wi);
      const fields = [w.title, w.goal, w.work, w.result].concat(w.topics, w.practice, w.questions, w.extra || [],
        Object.values(state.custom[k] || {}).map((c) => c.text));
      const hit = fields.find(has);
      const note = state.notes[k] || '';
      if (hit || has(note)) res.weeks.push({ mi, wi, snippet: hit || snippet(note, q), inNote: !hit });
    });
    Object.entries(state.worklog).forEach(([id, e]) => {
      if ([e.title, e.tech, e.problem, e.cause, e.solution, e.lesson].some(has)) res.wl.push([id, e]);
    });
    return res;
  }
  function postSearchCount(n) {
    try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'searchResult', count: n, total: 0 }, '*'); } catch (e) { /* nincs szülő */ }
  }
  function renderSearch() {
    const r = searchResults();
    const count = r.months.length + r.weeks.length + r.wl.length;
    postSearchCount(count);
    const months = r.months.map((mi) => '<button class="s-item" data-action="sel-month-open" data-mi="' + mi + '"><b>' + (mi + 1) + '. hónap – ' + hl(MONTHS[mi].title) + '</b><div class="small muted">' + hl(MONTHS[mi].goal) + '</div></button>').join('');
    const weeks = r.weeks.map((x) => '<button class="s-item" data-action="open-week" data-mi="' + x.mi + '" data-wi="' + x.wi + '"><b>' + (x.mi + 1) + '/' + (x.wi + 1) + ' – ' + hl(MONTHS[x.mi].weeks[x.wi].title) + '</b><div class="small muted">' + (x.inNote ? '📝 Jegyzet: ' : '') + hl(x.snippet) + '</div></button>').join('');
    const wl = r.wl.map(([id, e]) => '<button class="s-item" data-action="open-wl" data-id="' + esc(id) + '"><b>🛠 ' + hl(e.title || '(cím nélkül)') + '</b><div class="small muted">' + esc(e.date) + (e.tech ? ' · ' + hl(e.tech) : '') + '</div></button>').join('');
    $('#view-search').innerHTML = count
      ? (months ? '<div class="sec-title">Hónapok</div>' + months : '') +
        (weeks ? '<div class="sec-title mt12">Hetek</div>' + weeks : '') +
        (wl ? '<div class="sec-title mt12">Munkahelyi napló</div>' + wl : '')
      : '<div class="card small muted">Nincs találat.</div>';
  }
  function applySearch(q) {
    currentQuery = String(q || '').trim();
    ui.searchDismissed = false;
    if (!currentQuery) postSearchCount(0);
    render();
  }

  const RENDERERS = { overview: renderOverview, program: renderProgram, schedule: renderSchedule, worklog: renderWorklog, review: renderReview, data: renderData };

  /* ================= Műveletek ================= */
  function scrollTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function scrollToId(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  function stepWeek(d) {
    const idx = WEEKS.findIndex((x) => x.mi === ui.month && x.wi === ui.week);
    const n = WEEKS[Math.max(0, Math.min(WEEKS.length - 1, idx + d))];
    ui.month = n.mi; ui.week = n.wi;
    render();
  }
  function logTime(min, weekKey) {
    if (!requireOwner()) return;
    const cw = currentWeek();
    const key = parseWeekKey(weekKey) ? weekKey : wk(cw.mi, cw.wi);
    state.time[uid('t')] = { date: todayStr(), min: min, week: key };
    commit(true);
    toast('+' + fmtMin(min) + ' rögzítve');
    render();
  }
  function addCustom(k) {
    if (!requireOwner()) return;
    const inp = $('#customTask');
    const text = inp ? inp.value.trim() : '';
    if (!text) { toast('Írd be a feladat szövegét.'); return; }
    if (!state.custom[k]) state.custom[k] = {};
    state.custom[k][uid('c')] = { text: text, done: false };
    commit(true);
    render();
    const again = $('#customTask');
    if (again) again.focus();
  }
  function saveWorklog() {
    if (!requireOwner()) return;
    const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const entry = {
      date: DATE_RE.test(val('wlDate')) ? val('wlDate') : todayStr(),
      title: val('wlTitle'), tech: val('wlTech'), week: val('wlWeek'),
      problem: val('wlProblem'), cause: val('wlCause'), solution: val('wlSolution'), lesson: val('wlLesson')
    };
    if (!entry.title && !entry.problem) { toast('Adj meg legalább egy címet vagy a probléma leírását.'); return; }
    const id = ui.wlEditing === 'new' ? uid('w') : ui.wlEditing;
    state.worklog[id] = entry;
    commit(true);
    ui.wlEditing = null;
    ui.wlFilter = '';
    toast('Napló-bejegyzés mentve.');
    render();
  }
  function exportData() {
    const payload = { app: DB_PATH, exportedAt: new Date().toISOString(), state: state };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bms_itot_mentes_' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    toast('Export kész.');
  }
  function handleImportFile(file) {
    if (!file) return;
    if (!requireOwner()) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const raw = parsed && isObj(parsed.state) ? parsed.state : parsed;
        if (!isObj(raw) || !('tasks' in raw || 'worklog' in raw || 'notes' in raw)) throw new Error('nem ismerem fel a fájl formátumát');
        ui.importPreview = normalize(raw);
        ui.importError = null;
      } catch (err) {
        ui.importPreview = null;
        ui.importError = err.message;
      }
      render();
    };
    reader.onerror = () => { ui.importError = 'a fájl nem olvasható'; render(); };
    reader.readAsText(file);
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const a = el.dataset.action;
    const prevConfirm = ui.confirm;
    ui.confirm = null;
    const mi = el.dataset.mi != null ? +el.dataset.mi : null;
    const wi = el.dataset.wi != null ? +el.dataset.wi : null;
    switch (a) {
      case 'tab':
        ui.view = el.dataset.view; ui.searchDismissed = true; ui.importError = null;
        render(); scrollTop(); break;
      case 'open-week':
        ui.view = 'program'; ui.month = mi; ui.week = wi; ui.searchDismissed = true;
        render(); scrollToId('monthDetail'); break;
      case 'sel-month':
        ui.month = mi; ui.week = defaultWeekFor(mi);
        render(); scrollToId('monthDetail'); break;
      case 'sel-month-open':
        ui.view = 'program'; ui.month = mi; ui.week = defaultWeekFor(mi); ui.searchDismissed = true;
        render(); scrollToId('monthDetail'); break;
      case 'sel-week': ui.week = wi; render(); break;
      case 'prev-week': stepWeek(-1); break;
      case 'next-week': stepWeek(1); break;
      case 'pin':
        if (requireOwner()) { state.pinnedWeek = el.dataset.week; commit(true); toast('Ez lett az aktuális hét.'); render(); }
        break;
      case 'unpin':
        if (requireOwner()) { state.pinnedWeek = null; commit(true); render(); }
        break;
      case 'log-time': logTime(+el.dataset.min, el.dataset.week); break;
      case 'log-custom': {
        const inp = $('#customMin');
        const v = parseInt(inp && inp.value, 10);
        if (!(v > 0 && v <= 600)) { toast('Adj meg 1 és 600 közötti percet.'); break; }
        logTime(v, el.dataset.week);
        break;
      }
      case 'del-time':
        if (requireOwner()) { delete state.time[el.dataset.id]; commit(true); render(); }
        break;
      case 'add-custom': addCustom(el.dataset.week); break;
      case 'del-custom':
        if (requireOwner()) {
          const list = state.custom[el.dataset.week];
          if (list) { delete list[el.dataset.id]; if (!Object.keys(list).length) delete state.custom[el.dataset.week]; }
          commit(true); render();
        }
        break;
      case 'wl-new': if (requireOwner()) { ui.wlEditing = 'new'; render(); scrollTop(); } break;
      case 'wl-edit': if (requireOwner()) { ui.wlEditing = el.dataset.id; render(); scrollTop(); } break;
      case 'wl-cancel': ui.wlEditing = null; render(); break;
      case 'wl-save': saveWorklog(); break;
      case 'wl-del':
        if (!requireOwner()) break;
        if (prevConfirm === 'wl:' + el.dataset.id) { delete state.worklog[el.dataset.id]; commit(true); toast('Bejegyzés törölve.'); }
        else ui.confirm = 'wl:' + el.dataset.id;
        render(); break;
      case 'open-wl':
        ui.view = 'worklog'; ui.wlFilter = ''; ui.searchDismissed = true;
        render(); scrollToId('wl-' + el.dataset.id); break;
      case 'review-month': ui.reviewMonth = mi; render(); break;
      case 'review-next': {
        const n = ui.reviewMonth + 1;
        if (isOwner) { state.pinnedWeek = wk(n, 0); commit(true); toast('Továbbléptél a ' + (n + 1) + '. hónapra.'); }
        ui.view = 'program'; ui.month = n; ui.week = 0;
        render(); scrollTop(); break;
      }
      case 'sched-reset':
        if (requireOwner()) { state.schedule = null; commit(true); render(); }
        break;
      case 'export': exportData(); break;
      case 'import-confirm':
        if (requireOwner() && ui.importPreview) { state = ui.importPreview; ui.importPreview = null; commit(true); toast('Importálás kész.'); render(); }
        break;
      case 'import-cancel': ui.importPreview = null; ui.importError = null; render(); break;
      case 'reset-all':
        if (!requireOwner()) break;
        if (prevConfirm === 'reset') { state = emptyState(); commit(true); toast('Minden adat törölve.'); }
        else ui.confirm = 'reset';
        render(); break;
      case 'search-dismiss': ui.searchDismissed = true; render(); break;
      case 'search-show': ui.searchDismissed = false; render(); break;
      default: break;
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('input[data-task]')) {
      if (!requireOwner()) { t.checked = !t.checked; return; }
      if (t.checked) state.tasks[t.dataset.task] = true; else delete state.tasks[t.dataset.task];
      commit(true); render(); return;
    }
    if (t.matches('input[data-custom]')) {
      if (!requireOwner()) { t.checked = !t.checked; return; }
      const parts = t.dataset.custom.split('|');
      const c = state.custom[parts[0]] && state.custom[parts[0]][parts[1]];
      if (c) { c.done = t.checked; commit(true); render(); }
      return;
    }
    if (t.id === 'importFile') { handleImportFile(t.files && t.files[0]); t.value = ''; return; }
    if (t.matches('select[data-wl-filter]')) { ui.wlFilter = t.value; render(); }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!isOwner) return;
    if (t.matches('textarea[data-note]')) {
      const k = t.dataset.note;
      if (t.value) state.notes[k] = t.value; else delete state.notes[k];
      commit(); return;
    }
    if (t.matches('textarea[data-review]')) {
      const parts = t.dataset.review.split(':');
      const key = 'm' + parts[0];
      const ans = state.reviews[key] || (state.reviews[key] = {});
      if (t.value) ans['q' + parts[1]] = t.value; else delete ans['q' + parts[1]];
      if (!Object.keys(ans).length) delete state.reviews[key];
      commit(); return;
    }
    if (t.matches('textarea[data-building]')) { state.building = t.value; commit(); return; }
    if (t.matches('input[data-sched]')) {
      if (!state.schedule) state.schedule = META.defaultSchedule.map((x) => Object.assign({}, x));
      const parts = t.dataset.sched.split(':');
      const row = state.schedule[+parts[0]];
      if (!row) return;
      row[parts[1]] = parts[1] === 'min' ? Math.max(0, Math.min(600, parseInt(t.value, 10) || 0)) : t.value;
      commit();
      updateSchedSum();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const map = { customTask: 'add-custom', customMin: 'log-custom' };
    const action = map[e.target.id];
    if (!action) return;
    e.preventDefault();
    const b = document.querySelector('[data-action="' + action + '"]');
    if (b) b.click();
  });

  document.addEventListener('toggle', (e) => {
    if (e.target.matches && e.target.matches('details[data-qdetails]')) ui.qOpen = e.target.open;
  }, true);

  /* ================= Kapcsolat a főoldallal (index.html) ================= */
  window.addEventListener('message', (e) => {
    if (e.source !== window.parent) return;
    const d = e.data;
    if (!isObj(d)) return;
    if (d.type === 'theme') document.documentElement.setAttribute('data-theme', d.value === 'dark' ? 'dark' : 'light');
    else if (d.type === 'search') applySearch(d.query);
    else if (d.type === 'authState' && dbRef) setOwner(!!d.isOwner);
  });
  try { const t = localStorage.getItem('csr_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* nem elérhető */ }

  /* ================= Firebase ================= */
  if (typeof window.firebase !== 'undefined') {
    try {
      firebase.initializeApp({
        apiKey: "AIzaSyDbQUbxQUCli_ZaU5sGlKIueAcaRL4NmVU",
        authDomain: "csr-app-9f41c.firebaseapp.com",
        databaseURL: "https://csr-app-9f41c-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "csr-app-9f41c",
        storageBucket: "csr-app-9f41c.firebasestorage.app",
        messagingSenderId: "452006201935",
        appId: "1:452006201935:web:8bfca2af227fca4911b83a"
      });
      dbRef = firebase.database().ref(DB_PATH);
      auth = firebase.auth();
      auth.onAuthStateChanged((u) => setOwner(!!(u && u.email === OWNER_EMAIL)));
    } catch (err) {
      console.error('Firebase init error:', err);
      dbRef = null; auth = null;
    }
  }
  if (!dbRef) { isOwner = true; document.body.classList.remove('ro'); }

  load();
})();
</script>
</body>
</html>
