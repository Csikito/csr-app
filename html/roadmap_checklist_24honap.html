<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f8fafc; --bg2:#f1f5f9; --card:#fff; --border:#e2e8f0; --border2:#f1f5f9;
  --text:#1e293b; --muted:#64748b; --subtle:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --radius:10px; --radius-sm:7px; --transition:.15s ease;
  --g-dot:#1D9E75; --g-bg:#e8faf3; --g-text:#065f46; --g-border:#6ee7b7;
  --b-dot:#378ADD; --b-bg:#dbeafe; --b-text:#1e40af; --b-border:#93c5fd;
  --o-dot:#BA7517; --o-bg:#fef3c7; --o-text:#92400e; --o-border:#fcd34d;
  --p-dot:#7F77DD; --p-bg:#ede9fe; --p-text:#4c1d95; --p-border:#c4b5fd;
  --r-dot:#D4554A; --r-bg:#fee2e2; --r-text:#991b1b; --r-border:#fca5a5;
  --check-active:#1D9E75;
}
[data-theme="dark"] {
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --border:#334155; --border2:#1e293b;
  --text:#f1f5f9; --muted:#94a3b8; --subtle:#475569;
  --shadow:0 1px 4px rgba(0,0,0,.4); --shadow-md:0 4px 16px rgba(0,0,0,.4);
  --g-dot:#34d399; --g-bg:rgba(29,158,117,.15); --g-text:#6ee7b7; --g-border:rgba(29,158,117,.4);
  --b-dot:#60a5fa; --b-bg:rgba(55,138,221,.15); --b-text:#93c5fd; --b-border:rgba(55,138,221,.4);
  --o-dot:#fbbf24; --o-bg:rgba(186,117,23,.15); --o-text:#fcd34d; --o-border:rgba(186,117,23,.4);
  --p-dot:#a78bfa; --p-bg:rgba(127,119,221,.15); --p-text:#c4b5fd; --p-border:rgba(127,119,221,.4);
  --r-dot:#f87171; --r-bg:rgba(212,85,74,.15); --r-text:#fca5a5; --r-border:rgba(212,85,74,.4);
  --check-active:#34d399;
}
body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:20px; min-height:100vh; transition:background var(--transition),color var(--transition); font-size:14px; }

.search-banner { display:none; font-size:12px; color:var(--muted); background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 12px; margin-bottom:14px; }
.search-banner.visible { display:block; }

.topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:12px; }
.prog-wrap { display:flex; align-items:center; gap:14px; }
.prog-ring-wrap { position:relative; }
.prog-ring { transform:rotate(-90deg); }
.prog-ring-bg { fill:none; stroke:var(--border); stroke-width:4; }
.prog-ring-fill { fill:none; stroke:var(--check-active); stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .4s ease; }
.prog-label { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:2px; }
.prog-num { font-size:22px; font-weight:700; color:var(--text); line-height:1; }
.save-ind { font-size:11px; color:var(--check-active); opacity:0; transition:opacity .3s; margin-left:8px; }
.save-ind.show { opacity:1; }
.btn-group { display:flex; gap:6px; }
.btn-sm { font-size:12px; font-weight:500; color:var(--muted); background:var(--card); border:1px solid var(--border); padding:7px 14px; border-radius:999px; cursor:pointer; transition:all var(--transition); box-shadow:var(--shadow); }
.btn-sm:hover { border-color:var(--subtle); color:var(--text); }

/* Phase switcher */
.phase-switch { display:flex; gap:6px; margin-bottom:16px; }
.phase-btn { flex:1; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; transition:all var(--transition); box-shadow:var(--shadow); text-align:center; }
.phase-btn:hover { border-color:var(--subtle); color:var(--text); }
.phase-btn.active { background:#4f46e5; color:#fff; border-color:#4f46e5; box-shadow:0 2px 8px rgba(79,70,229,.3); }
.phase-btn .pb-sub { display:block; font-size:10px; font-weight:500; opacity:.8; margin-top:2px; }

/* Month chips */
.mrow { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin-bottom:14px; }
.mc { padding:7px 4px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:11px; font-weight:500; cursor:pointer; text-align:center; transition:all var(--transition); border-top:3px solid transparent; box-shadow:var(--shadow); }
.mc:hover { border-color:var(--subtle); color:var(--text); }
.mc.ph1 { border-top-color:var(--g-dot); }
.mc.ph2 { border-top-color:var(--b-dot); }
.mc.ph3 { border-top-color:var(--o-dot); }
.mc.active.ph1 { background:var(--g-bg); color:var(--g-text); border-color:var(--g-border); }
.mc.active.ph2 { background:var(--b-bg); color:var(--b-text); border-color:var(--b-border); }
.mc.active.ph3 { background:var(--o-bg); color:var(--o-text); border-color:var(--o-border); }
.mc-pct { font-size:9px; color:var(--muted); margin-top:2px; }

/* Week tabs */
.wtabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
.wtab { padding:7px 18px; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:13px; font-weight:500; cursor:pointer; transition:all var(--transition); box-shadow:var(--shadow); }
.wtab:hover { border-color:var(--subtle); color:var(--text); }
.wtab.active { background:#4f46e5; color:#fff; border-color:#4f46e5; box-shadow:0 2px 8px rgba(79,70,229,.3); }
.wtab .hit-badge { display:inline-block; font-size:10px; background:#4f46e5; color:#fff; border-radius:999px; padding:0 5px; margin-left:4px; line-height:16px; vertical-align:middle; }
.wtab.active .hit-badge { background:rgba(255,255,255,.3); }

/* Month title + artifact banner */
.month-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; }
.artifact-box { font-size:12px; padding:9px 13px; border-left:3px solid var(--b-dot); background:var(--b-bg); border-radius:0 var(--radius-sm) var(--radius-sm) 0; color:var(--b-text); margin-bottom:14px; line-height:1.5; }
.artifact-box b { font-weight:700; }

/* Week note */
.wnote { font-size:13px; font-style:italic; padding:10px 14px; border-left:3px solid var(--g-dot); background:var(--g-bg); border-radius:0 var(--radius-sm) var(--radius-sm) 0; color:var(--g-text); margin-bottom:14px; line-height:1.55; }

/* Pillar grid */
.pillars-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.pillars-grid .psec:last-child:nth-child(odd) { grid-column: 1 / -1; }
.psec { border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; background:var(--card); box-shadow:var(--shadow); transition:background var(--transition); }
.psec-title { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; display:flex; align-items:center; gap:6px; color:var(--muted); }
.pdot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }

/* Task rows */
.task-row { display:flex; align-items:flex-start; gap:10px; padding:7px 0; border-bottom:1px solid var(--border); cursor:pointer; transition:opacity var(--transition); border-radius:4px; }
.task-row:last-child { border-bottom:none; }
.task-row:hover { opacity:.8; }
.task-row.done .task-txt { color:var(--muted); text-decoration:line-through; }
.task-row.no-match { display:none; }
.cb { width:18px; height:18px; border-radius:4px; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all var(--transition); margin-top:1px; background:var(--card); }
.task-row.done .cb { background:var(--check-active); border-color:var(--check-active); }
.ckmark { display:none; }
.task-row.done .ckmark { display:block; }
.task-txt { font-size:13px; color:var(--text); line-height:1.5; }

/* Daily box */
.daily-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; margin-top:12px; }
.daily-hd { font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
.daily-grid { display:grid; grid-template-columns:1fr 1fr; gap:2px 16px; }
.daily-r { display:flex; justify-content:space-between; font-size:13px; color:var(--text); padding:4px 0; border-bottom:1px solid var(--border); }
.daily-r:last-child { border-bottom:none; }
.dt { font-size:12px; color:var(--muted); font-weight:500; }

/* Phase 2 quarter cards */
.q-intro { font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:16px; padding:11px 14px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); }
.q-card { border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; background:var(--card); box-shadow:var(--shadow); margin-bottom:12px; }
.q-card-hd { font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.q-chip { font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--p-bg); color:var(--p-text); }

mark { background:rgba(250,204,21,.4); color:inherit; border-radius:2px; padding:0 1px; }
[data-theme="dark"] mark { background:rgba(250,204,21,.22); }

.arch-chip { font-size:10px; font-weight:600; padding:2px 8px; border-radius:999px; background:var(--o-bg); color:var(--o-text); }

/* Auth */
.btn-sm.owner { color:var(--check-active); border-color:var(--check-active); }
body.ro .task-row { cursor:default; }
body.ro .task-row:hover { opacity:1 !important; }
body.ro .cb { opacity:.4; }
</style>
</head>

let cur = {m:0, w:0};
let phase = 1;
let checked = {};

function load() {
  return dbRef.get().then(snapshot => {
    if (snapshot.exists()) checked = snapshot.val();
  }).catch(() => {});
}

function save() {
  if (!isOwner) return;
  const doWrite = () => {
    dbRef.set(checked).then(() => {
      const ind = document.getElementById('saveInd');
      ind.textContent = '✓ Mentve'; ind.style.color = '';
      ind.classList.add('show');
      setTimeout(() => ind.classList.remove('show'), 1500);
    }).catch(err => {
      console.error('Firebase save error:', err.code, err.message);
      const ind = document.getElementById('saveInd');
      ind.textContent = '✗ Mentés sikertelen'; ind.style.color = '#f87171';
      ind.classList.add('show');
      setTimeout(() => { ind.classList.remove('show'); ind.textContent = '✓ Mentve'; ind.style.color = ''; }, 3000);
    });
  };
  if (auth.currentUser) {
    doWrite();
  } else {
    const unsub = auth.onAuthStateChanged(u => {
      unsub();
      if (u && u.email === OWNER_EMAIL) doWrite();
    });
  }
}

function key(m,w,p,i) { return `${m}-${w}-${p}-${i}`; }
function qkey(qi,i) { return `q-${qi}-${i}`; }
function akey(mi,i) { return `a-${mi}-${i}`; }

function totalTasks() {
  let t = 0;
  MONTHS.forEach(m => m.weeks.forEach(w => Object.keys(P).forEach(p => t += (w[p]||[]).length)));
  QUARTERS.forEach(q => t += q.tasks.length);
  ARCH_MONTHS.forEach(m => t += m.tasks.length);
  return t;
}
function doneTasks() { return Object.values(checked).filter(Boolean).length; }

function monthDone(mi) {
  let done=0, total=0;
  MONTHS[mi].weeks.forEach((w,wi) => Object.keys(P).forEach(p => {
    (w[p]||[]).forEach((_,i) => { total++; if(checked[key(mi,wi,p,i)]) done++; });
  }));
  return total > 0 ? Math.round(done/total*100) : 0;
}

function updateProgress() {
  const done = doneTasks(), total = totalTasks();
  document.getElementById('progNum').textContent = done + ' / ' + total;
  const circ = 138.2;
  document.getElementById('ringFill').style.strokeDashoffset = circ - (total > 0 ? (done/total)*circ : 0);
}

function renderMonths() {
  document.getElementById('mrow').innerHTML = MONTHS.map((m,i) => {
    const pct = monthDone(i);
    return `<div class="mc ph${m.ph} ${i===cur.m?'active':''}" onclick="selM(${i})">
      ${m.name}
      <div class="mc-pct">${pct}%</div>
    </div>`;
  }).join('');
}

function renderWeekTabs() {
  document.getElementById('wtabs').innerHTML = [1,2,3,4].map((n,i) =>
    `<button class="wtab ${i===cur.w?'active':''}" onclick="selW(${i})">${n}. hét</button>`
  ).join('');
}

function renderContent() {
  const m = MONTHS[cur.m], w = m.weeks[cur.w];
  const q = currentQuery;
  let html = `<div class="month-title">${hl(m.title, q)}</div>`;
  html += `<div class="artifact-box"><b>Artifact:</b> ${hl(m.artifact, q)}</div>`;
  html += `<div class="wnote">${hl(w.note, q)}</div><div class="pillars-grid">`;
  Object.keys(P).forEach(p => {
    const tasks = w[p] || [];
    if (!tasks.length) return;
    const col = `var(--${P[p].varname}-dot)`;
    html += `<div class="psec" data-pillar="${p}" data-week="${cur.w}" data-month="${cur.m}">
      <div class="psec-title"><div class="pdot" style="background:${col}"></div>${P[p].label}</div>`;
    tasks.forEach((t,i) => {
      const k = key(cur.m,cur.w,p,i);
      const done = !!checked[k];
      const hidden = q && !t.toLowerCase().includes(q.toLowerCase()) ? ' no-match' : '';
      html += `<div class="task-row ${done?'done':''}${hidden}" data-taskkey="${k}" onclick="toggle('${k}')">
        <div class="cb">
          <svg class="ckmark" width="11" height="11" viewBox="0 0 11 11" fill="none">
            <polyline points="1.5,5.5 4.5,8.5 9.5,2.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-txt">${hl(t, q)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  const daily = m.daily;
  html += `<div class="daily-box"><div class="daily-hd">Napi rutin – ebben a hónapban</div><div class="daily-grid">`;
  daily.forEach(d => { html += `<div class="daily-r"><span>${hl(d.t, q)}</span><span class="dt">${d.d}</span></div>`; });
  html += `</div></div>`;
  document.getElementById('content').innerHTML = html;
}

function renderPhase2() {
  const q = currentQuery;
  let html = `<div class="q-intro">${hl(Q_INTRO, q)}</div>`;
  QUARTERS.forEach((qu, qi) => {
    html += `<div class="q-card"><div class="q-card-hd"><span class="q-chip">${qu.chip}</span>${hl(qu.title, q)}</div>`;
    qu.tasks.forEach((t,i) => {
      const k = qkey(qi,i);
      const done = !!checked[k];
      const hidden = q && !t.toLowerCase().includes(q.toLowerCase()) ? ' no-match' : '';
      html += `<div class="task-row ${done?'done':''}${hidden}" data-taskkey="${k}" onclick="toggle('${k}')">
        <div class="cb">
          <svg class="ckmark" width="11" height="11" viewBox="0 0 11 11" fill="none">
            <polyline points="1.5,5.5 4.5,8.5 9.5,2.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-txt">${hl(t, q)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('phase2').innerHTML = html;
}

function renderPhase3() {
  const q = currentQuery;
  let html = `<div class="q-intro">${hl(ARCH_INTRO, q)}</div>`;
  ARCH_MONTHS.forEach((am, mi) => {
    html += `<div class="q-card"><div class="q-card-hd"><span class="arch-chip">${am.chip}</span>${hl(am.title, q)}</div>`;
    am.tasks.forEach((t, i) => {
      const k = akey(mi, i);
      const done = !!checked[k];
      const hidden = q && !t.toLowerCase().includes(q.toLowerCase()) ? ' no-match' : '';
      html += `<div class="task-row ${done?'done':''}${hidden}" data-taskkey="${k}" onclick="toggle('${k}')">
        <div class="cb">
          <svg class="ckmark" width="11" height="11" viewBox="0 0 11 11" fill="none">
            <polyline points="1.5,5.5 4.5,8.5 9.5,2.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="task-txt">${hl(t, q)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('phase3').innerHTML = html;
}

let currentQuery = '';

function hl(text, q) {
  if (!q) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}

function applySearch(q) {
  currentQuery = q;
  const banner = document.getElementById('searchBanner');
  if (!q) {
    banner.classList.remove('visible');
    document.querySelectorAll('.task-row').forEach(r => r.classList.remove('no-match'));
    document.querySelectorAll('.wtab .hit-badge').forEach(b => b.remove());
    window.parent?.postMessage({type:'searchResult',count:0,total:0},'*');
    if (phase===1) render(); else renderPhase2();
    return;
  }
  const low = q.toLowerCase();
  let totalHits = 0;
  if (phase === 1) {
    const m = MONTHS[cur.m];
    const weekHits = m.weeks.map(w =>
      Object.keys(P).reduce((sum, p) => sum + (w[p]||[]).filter(t => t.toLowerCase().includes(low)).length, 0)
    );
    totalHits = weekHits.reduce((a,b)=>a+b,0);
    renderContent();
    document.querySelectorAll('.wtab').forEach((btn, i) => {
      btn.querySelector('.hit-badge')?.remove();
      if (weekHits[i] > 0) {
        const badge = document.createElement('span');
        badge.className = 'hit-badge';
        badge.textContent = weekHits[i];
        btn.appendChild(badge);
      }
    });
    if (weekHits[cur.w] === 0 && totalHits > 0) {
      const best = weekHits.indexOf(Math.max(...weekHits));
      selW(best);
    }
  } else if (phase === 2) {
    totalHits = QUARTERS.reduce((s,qu)=> s + qu.tasks.filter(t=>t.toLowerCase().includes(low)).length, 0);
    renderPhase2();
  } else {
    totalHits = ARCH_MONTHS.reduce((s,am)=> s + am.tasks.filter(t=>t.toLowerCase().includes(low)).length, 0);
    renderPhase3();
  }
  banner.textContent = totalHits ? `🔍 "${q}" — ${totalHits} egyező feladat` : `🔍 "${q}" — nincs találat`;
  banner.classList.add('visible');
  window.parent?.postMessage({type:'searchResult',count:totalHits,total:0},'*');
}

function render() { renderMonths(); renderWeekTabs(); renderContent(); updateProgress(); }

function selPhase(p) {
  phase = p;
  document.getElementById('phaseBtn1').classList.toggle('active', p===1);
  document.getElementById('phaseBtn2').classList.toggle('active', p===2);
  document.getElementById('phaseBtn3').classList.toggle('active', p===3);
  document.getElementById('phase1').style.display = p===1 ? '' : 'none';
  document.getElementById('phase2').style.display = p===2 ? '' : 'none';
  document.getElementById('phase3').style.display = p===3 ? '' : 'none';
  if (p===1) { document.getElementById('btnResetMonth').textContent = 'Hónap törlése'; render(); }
  else if (p===2) { document.getElementById('btnResetMonth').textContent = 'Fázis 2 törlése'; renderPhase2(); updateProgress(); }
  else { document.getElementById('btnResetMonth').textContent = 'Fázis 3 törlése'; renderPhase3(); updateProgress(); }
  if (currentQuery) applySearch(currentQuery);
}

function selM(i) { cur.m=i; cur.w=0; render(); if(currentQuery) applySearch(currentQuery); }
function selW(i) { cur.w=i; renderWeekTabs(); renderContent(); if(currentQuery) applySearch(currentQuery); }

function toggle(k) {
  if (!isOwner) return;
  checked[k] = !checked[k];
  save();
  if (phase===1) render(); else if (phase===2) { renderPhase2(); updateProgress(); } else { renderPhase3(); updateProgress(); }
  if (currentQuery) applySearch(currentQuery);
}

function resetMonth() {
  if (!isOwner) return;
  if (phase === 1) {
    const m = cur.m;
    MONTHS[m].weeks.forEach((w,wi) => Object.keys(P).forEach(p =>
      (w[p]||[]).forEach((_,i) => { delete checked[key(m,wi,p,i)]; })
    ));
  } else if (phase === 2) {
    QUARTERS.forEach((qu,qi)=> qu.tasks.forEach((_,i)=> { delete checked[qkey(qi,i)]; }));
  } else {
    ARCH_MONTHS.forEach((am,mi)=> am.tasks.forEach((_,i)=> { delete checked[akey(mi,i)]; }));
  }
  save();
  if (phase===1) render(); else if (phase===2) { renderPhase2(); updateProgress(); } else { renderPhase3(); updateProgress(); }
}

function resetAll() {
  if (!isOwner) return;
  checked = {};
  save();
  if (phase===1) render(); else if (phase===2) { renderPhase2(); updateProgress(); } else { renderPhase3(); updateProgress(); }
}

window.addEventListener('message', e => {
  if (!e.data) return;
  if (e.data.type === 'theme') document.documentElement.setAttribute('data-theme', e.data.value);
  if (e.data.type === 'search') applySearch(e.data.query);
  if (e.data.type === 'authState') {
    isOwner = e.data.isOwner;
    document.getElementById('btnResetMonth').style.display = isOwner ? '' : 'none';
    document.getElementById('btnResetAll').style.display = isOwner ? '' : 'none';
    document.body.classList.toggle('ro', !isOwner);
  }
});
