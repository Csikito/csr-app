<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12 Hónapos Mesterterv</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root {
  --bg:#f8fafc; --bg2:#f1f5f9; --card:#fff; --border:#e2e8f0; --border2:#f1f5f9;
  --text:#1e293b; --muted:#64748b; --subtle:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --radius:10px; --radius-sm:7px; --transition:.15s ease;
  --g-dot:#1D9E75; --g-bg:#e8faf3; --g-text:#065f46; --g-border:#6ee7b7;
  --b-dot:#378ADD; --b-bg:#dbeafe; --b-text:#1e40af; --b-border:#93c5fd;
  --o-dot:#BA7517; --o-bg:#fef3c7; --o-text:#92400e; --o-border:#fcd34d;
  --p-dot:#7F77DD; --p-bg:#ede9fe; --p-text:#4c1d95; --p-border:#c4b5fd;
  --r-dot:#D4554A; --r-bg:#fee2e2; --r-text:#991b1b; --r-border:#fca5a5;
}
[data-theme="dark"] {
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --border:#334155; --border2:#1e293b;
  --text:#f1f5f9; --muted:#94a3b8; --subtle:#475569;
  --shadow:0 1px 4px rgba(0,0,0,.4); --shadow-md:0 4px 16px rgba(0,0,0,.4);
  --g-dot:#34d399; --g-bg:rgba(29,158,117,.15); --g-text:#6ee7b7; --g-border:rgba(29,158,117,.4);
  --b-dot:#60a5fa; --b-bg:rgba(55,138,221,.15); --b-text:#93c5fd; --b-border:rgba(55,138,221,.4);
  --o-dot:#fbbf24; --o-bg:rgba(186,117,23,.15); --o-text:#fcd34d; --o-border:rgba(186,117,23,.4);
  --p-dot:#a78bfa; --p-bg:rgba(127,119,221,.15); --p-text:#c4b5fd; --p-border:rgba(127,119,221,.4);
  --r-dot:#f87171; --r-bg:rgba(212,85,74,.15); --r-text:#fca5a5; --r-border:rgba(212,85,74,.4);
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  transition: background var(--transition), color var(--transition);
}

/* SEARCH BANNER */
.search-banner {
  display: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.search-banner.visible { display: block; }

/* PILLAR FILTER PILLS */
.pillars {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.plabel {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  transition: all var(--transition);
  font-weight: 400;
  user-select: none;
}
.plabel:hover { opacity: .85; }
.plabel.active { font-weight: 600; }
.plabel[data-p="all"].active  { background: #4f46e5; color: #fff; border-color: #4f46e5; }
.plabel[data-p="angol"].active  { background: var(--g-bg); color: var(--g-text); border-color: var(--g-border); }
.plabel[data-p="tech"].active   { background: var(--b-bg); color: var(--b-text); border-color: var(--b-border); }
.plabel[data-p="karrier"].active{ background: var(--o-bg); color: var(--o-text); border-color: var(--o-border); }
.plabel[data-p="elet"].active   { background: var(--p-bg); color: var(--p-text); border-color: var(--p-border); }
.plabel[data-p="penz"].active   { background: var(--r-bg); color: var(--r-text); border-color: var(--r-border); }

.pdot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

/* MONTH CHIP GRID */
.mrow {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-bottom: 14px;
}
.mc {
  padding: 7px 4px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  border-top: 3px solid transparent;
  background: var(--card);
  color: var(--muted);
  font-size: 11px;
  cursor: pointer;
  text-align: center;
  transition: all var(--transition);
  box-shadow: var(--shadow);
}
.mc:hover { opacity: .8; }
.mc.ph1 { border-top-color: var(--g-dot); }
.mc.ph2 { border-top-color: var(--b-dot); }
.mc.ph3 { border-top-color: var(--o-dot); }
.mc.active.ph1 { background: var(--g-bg); color: var(--g-text); font-weight: 600; border-color: var(--g-border); border-top-color: var(--g-dot); }
.mc.active.ph2 { background: var(--b-bg); color: var(--b-text); font-weight: 600; border-color: var(--b-border); border-top-color: var(--b-dot); }
.mc.active.ph3 { background: var(--o-bg); color: var(--o-text); font-weight: 600; border-color: var(--o-border); border-top-color: var(--o-dot); }
.mc.no-match { opacity: .25; pointer-events: none; }
.mc.has-match { outline: 2px solid rgba(250,204,21,.6); }

/* DETAIL CARD */
.dcard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  box-shadow: var(--shadow-md);
}

.dhead { margin-bottom: 1rem; }
.dtitle { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 5px; }
.dbadge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 999px;
  font-weight: 500;
  letter-spacing: .03em;
}
.b1 { background: var(--g-bg); color: var(--g-text); }
.b2 { background: var(--b-bg); color: var(--b-text); }
.b3 { background: var(--o-bg); color: var(--o-text); }

/* PILLAR CARD GRID */
.pgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 1rem;
}
.pcard {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .8rem;
  background: var(--card);
  box-shadow: var(--shadow);
}
.pcard.hidden { display: none; }
.pctitle {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pcdot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.pitem {
  font-size: 12px;
  color: var(--text);
  padding: 4px 0;
  border-bottom: 1px solid var(--border2);
  display: flex;
  gap: 6px;
  align-items: flex-start;
  line-height: 1.5;
}
.pitem:last-child { border-bottom: none; }
.pidot { width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }

/* DAILY BOX */
.daily {
  background: var(--bg2);
  border-radius: var(--radius-sm);
  padding: .75rem 1rem;
  margin-bottom: 1rem;
}
.daily-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 7px;
}
.drows {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px 16px;
}
.drow {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text);
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.drow:last-child { border-bottom: none; }
.dtime { font-size: 11px; color: var(--muted); }

/* MILESTONES */
.mstones {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.ms {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: .7rem .85rem;
  background: var(--card);
  display: flex;
  gap: 8px;
  align-items: flex-start;
  box-shadow: var(--shadow);
}
.ms.hidden { display: none; }
.msico { font-size: 15px; flex-shrink: 0; }
.mstext { font-size: 12px; color: var(--text); line-height: 1.5; }
.mssub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* MARK (search highlight) */
mark {
  background: rgba(250,204,21,.4);
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}
[data-theme="dark"] mark { background: rgba(250,204,21,.22); }

/* SECTION LABEL for milestones */
.section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 7px;
}
</style>
</head>

/* pillar → CSS var prefix mapping */
const pVars = {angol:"g", tech:"b", karrier:"o", elet:"p", penz:"r"};
const pLabels = {angol:"🇬🇧 Angol", tech:"🔧 Technika", karrier:"💼 Karrier", elet:"💪 Életmód", penz:"💰 Pénzügy"};
let curM = 0, curFilter = "all", currentQuery = '';

/* --- SEARCH HELPERS --- */
function hl(text, q) {
  if (!q) return text;
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${esc})`, 'gi'), '<mark>$1</mark>');
}
function monthMatches(m, q) {
  if (!q) return true;
  const low = q.toLowerCase();
  return [m.title, m.phName,
    ...m.angol, ...m.tech, ...m.karrier, ...m.elet, ...m.penz,
    ...m.daily.map(d => d.t),
    ...m.ms.map(ms => ms.t + ' ' + ms.s)
  ].some(t => t && t.toLowerCase().includes(low));
}
function applySearch(q) {
  currentQuery = q;
  const banner = document.getElementById('searchBanner');
  if (!q) {
    banner.classList.remove('visible');
    document.querySelectorAll('.mc').forEach(c => c.classList.remove('no-match','has-match'));
    renderDetail();
    window.parent?.postMessage({type:'searchResult',count:0,total:0},'*');
    return;
  }
  const matches = M.filter(m => monthMatches(m, q));
  banner.textContent = matches.length
    ? `🔍 "${q}" — ${matches.length} hónap tartalmaz egyezést`
    : `🔍 "${q}" — nincs találat`;
  banner.classList.add('visible');
  document.querySelectorAll('.mc').forEach((chip, i) => {
    const hit = monthMatches(M[i], q);
    chip.classList.toggle('no-match', !hit);
    chip.classList.toggle('has-match', hit);
  });
  if (matches.length > 0 && !monthMatches(M[curM], q)) {
    curM = M.indexOf(matches[0]);
    renderRow();
  }
  renderDetail();
  window.parent?.postMessage({type:'searchResult',count:matches.length,total:M.length},'*');
}

/* --- FILTER --- */
function filterPillar(p, el) {
  curFilter = p;
  document.querySelectorAll('.plabel').forEach(e => {
    e.classList.toggle('active', e.dataset.p === p);
  });
  renderDetail();
}

/* --- MONTH CHIPS --- */
function renderRow() {
  document.getElementById('mrow').innerHTML = M.map((m,i) =>
    `<div class="mc ph${m.ph} ${i===curM?'active':''}" onclick="selM(${i})">${m.chip}</div>`
  ).join('');
}
function selM(i) { curM = i; renderRow(); renderDetail(); }

/* --- PILLAR CARD --- */
function pcard(key, items) {
  const v = pVars[key];
  const hidden = curFilter !== 'all' && curFilter !== key ? 'hidden' : '';
  return `<div class="pcard ${hidden}" data-pillar="${key}">
    <div class="pctitle" style="color:var(--${v}-text)"><div class="pcdot" style="background:var(--${v}-dot)"></div>${pLabels[key]}</div>
    ${items.map(t=>`<div class="pitem"><span class="pidot" style="background:var(--${v}-dot)"></span>${hl(t, currentQuery)}</div>`).join('')}
  </div>`;
}

/* --- DETAIL --- */
function renderDetail() {
  const m = M[curM];
  const bc = m.ph===1?'b1':m.ph===2?'b2':'b3';

  const drows = m.daily.map(d =>
    `<div class="drow"><span>${hl(d.t, currentQuery)}</span><span class="dtime">${d.i}</span></div>`
  ).join('');

  const mss = m.ms.map(ms => {
    const hidden = curFilter !== 'all' && curFilter !== ms.p ? 'hidden' : '';
    return `<div class="ms ${hidden}">
      <div class="msico">${ms.ico}</div>
      <div>
        <div class="mstext">${hl(ms.t, currentQuery)}</div>
        ${ms.s ? `<div class="mssub">${hl(ms.s, currentQuery)}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('dcard').innerHTML = `
    <div class="dhead">
      <div class="dtitle">${hl(m.title, currentQuery)}</div>
      <span class="dbadge ${bc}">${hl(m.phName, currentQuery)}</span>
    </div>
    <div class="pgrid">
      ${pcard('angol', m.angol)}
      ${pcard('tech', m.tech)}
      ${pcard('karrier', m.karrier)}
      ${pcard('elet', m.elet)}
      ${pcard('penz', m.penz)}
    </div>
    <div class="daily">
      <div class="daily-title">Napi rutin – ebben a hónapban</div>
      <div class="drows">${drows}</div>
    </div>
    <div>
      <div class="section-label">Havi mérföldkövek</div>
      <div class="mstones">${mss}</div>
    </div>
  `;
}

/* --- INIT --- */
renderRow();
renderDetail();

/* --- postMessage + theme --- */
window.addEventListener('message', e => {
  if (!e.data) return;
  if (e.data.type === 'theme') document.documentElement.setAttribute('data-theme', e.data.value);
  if (e.data.type === 'search') applySearch(e.data.query);
});
