<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kamatos Kamat Kalkulátor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root {
  --bg:#f8fafc; --bg2:#f1f5f9; --card:#fff; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b; --subtle:#94a3b8;
  --shadow:0 1px 3px rgba(0,0,0,.08);
  --radius:10px; --radius-sm:8px;
  --transition:.15s ease;

  --color-text-secondary: #64748b;
  --color-background-secondary: #f1f5f9;
  --color-text-success: #16a34a;
  --border-radius-md: 8px;
}
[data-theme="dark"] {
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --border:#334155;
  --text:#f1f5f9; --muted:#94a3b8; --subtle:#475569;
  --shadow:0 1px 4px rgba(0,0,0,.4);

  --color-text-secondary: #94a3b8;
  --color-background-secondary: #1e293b;
  --color-text-success: #4ade80;
}
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
  transition: background var(--transition), color var(--transition);
}
.page-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.page-sub {
  font-size: .82rem;
  color: var(--muted);
  margin-bottom: 20px;
}
input[type="range"] { accent-color: #4f46e5; }
</style>
</head>
<body>

<div class="page-title">💰 Kamatos kamat kalkulátor</div>
<div class="page-sub">Állítsd be a paramétereket és nézd meg hogyan növekszik a tőkéd az idő múlásával</div>

<div style="padding: 1.5rem 0;">

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1.5rem;">
    <div>
      <label style="font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 6px;">Starting amount</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="principal" min="1000" max="50000" step="1000" value="10000" style="flex:1;">
        <span id="principal-out" style="font-size: 14px; font-weight: 500; min-width: 60px; text-align: right;">€10,000</span>
      </div>
    </div>
    <div>
      <label style="font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 6px;">Annual return</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="rate" min="1" max="15" step="1" value="7" style="flex:1;">
        <span id="rate-out" style="font-size: 14px; font-weight: 500; min-width: 40px; text-align: right;">7%</span>
      </div>
    </div>
    <div>
      <label style="font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 6px;">Years</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="years" min="5" max="40" step="5" value="20" style="flex:1;">
        <span id="years-out" style="font-size: 14px; font-weight: 500; min-width: 40px; text-align: right;">20 yr</span>
      </div>
    </div>
    <div>
      <label style="font-size: 13px; color: var(--color-text-secondary); display: block; margin-bottom: 6px;">Monthly contribution</label>
      <div style="display: flex; align-items: center; gap: 8px;">
        <input type="range" id="monthly" min="0" max="1000" step="50" value="0" style="flex:1;">
        <span id="monthly-out" style="font-size: 14px; font-weight: 500; min-width: 60px; text-align: right;">€0</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem;">
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 14px;">
      <div style="font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px;">Total invested</div>
      <div id="stat-invested" style="font-size: 22px; font-weight: 500;">€10,000</div>
    </div>
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 14px;">
      <div style="font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px;">Interest earned</div>
      <div id="stat-interest" style="font-size: 22px; font-weight: 500; color: var(--color-text-success);">€28,697</div>
    </div>
    <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 14px;">
      <div style="font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px;">Final value</div>
      <div id="stat-final" style="font-size: 22px; font-weight: 500;">€38,697</div>
    </div>
  </div>

  <div style="position: relative; width: 100%; height: 260px;">
    <canvas id="chart"></canvas>
  </div>

  <div style="display: flex; gap: 20px; margin-top: 12px; font-size: 12px; color: var(--color-text-secondary);">
    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #378ADD;"></span>Total value</span>
    <span style="display: flex; align-items: center; gap: 6px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #D3D1C7;"></span>Amount invested</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const fmt = v => '€' + Math.round(v).toLocaleString('hu-HU');

  function compute(principal, rate, years, monthly) {
    const r = rate / 100;
    const labels = [], totals = [], invested = [];
    for (let y = 0; y <= years; y++) {
      const totalVal = principal * Math.pow(1 + r, y) + monthly * 12 * ((Math.pow(1 + r, y) - 1) / r || 0);
      const inv = principal + monthly * 12 * y;
      labels.push(y === 0 ? 'Now' : 'Yr ' + y);
      totals.push(Math.round(totalVal));
      invested.push(Math.round(inv));
    }
    return { labels, totals, invested };
  }

  let chart;

  function tickColor() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? '#94a3b8' : '#64748b';
  }
  function gridColor() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'rgba(255,255,255,0.06)' : 'rgba(128,128,128,0.1)';
  }

  function applyChartTheme() {
    if (!chart) return;
    chart.options.scales.y.ticks.color = tickColor();
    chart.options.scales.x.ticks.color = tickColor();
    chart.options.scales.y.grid.color = gridColor();
    chart.update();
  }

  function update() {
    const principal = +document.getElementById('principal').value;
    const rate      = +document.getElementById('rate').value;
    const years     = +document.getElementById('years').value;
    const monthly   = +document.getElementById('monthly').value;

    document.getElementById('principal-out').textContent = fmt(principal);
    document.getElementById('rate-out').textContent      = rate + '%';
    document.getElementById('years-out').textContent     = years + ' yr';
    document.getElementById('monthly-out').textContent   = fmt(monthly);

    const { labels, totals, invested } = compute(principal, rate, years, monthly);
    const finalVal  = totals[totals.length - 1];
    const totalInv  = invested[invested.length - 1];
    const interest  = finalVal - totalInv;

    document.getElementById('stat-invested').textContent = fmt(totalInv);
    document.getElementById('stat-interest').textContent = fmt(interest);
    document.getElementById('stat-final').textContent    = fmt(finalVal);

    if (chart) {
      chart.data.labels = labels;
      chart.data.datasets[0].data = totals;
      chart.data.datasets[1].data = invested;
      chart.update();
    } else {
      chart = new Chart(document.getElementById('chart'), {
        type: 'line',
        data: {
          labels,
          datasets: [
            {
              label: 'Total value',
              data: totals,
              borderColor: '#378ADD',
              backgroundColor: 'rgba(55,138,221,0.12)',
              fill: true,
              tension: 0.3,
              pointRadius: 2,
              borderWidth: 2
            },
            {
              label: 'Amount invested',
              data: invested,
              borderColor: '#B4B2A9',
              backgroundColor: 'rgba(180,178,169,0.08)',
              fill: true,
              tension: 0,
              pointRadius: 2,
              borderWidth: 1.5,
              borderDash: [4, 3]
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ctx.dataset.label + ': ' + fmt(ctx.parsed.y)
              }
            }
          },
          scales: {
            y: {
              ticks: {
                color: tickColor(),
                callback: v => '€' + (v >= 1000 ? Math.round(v/1000) + 'k' : v),
                font: { size: 11 }
              },
              grid: { color: gridColor() }
            },
            x: {
              ticks: { color: tickColor(), autoSkip: true, maxTicksLimit: 9, font: { size: 11 } },
              grid: { display: false }
            }
          }
        }
      });
    }
  }

  ['principal','rate','years','monthly'].forEach(id => {
    document.getElementById(id).addEventListener('input', update);
  });
  update();

  window.addEventListener('message', e => {
    if (!e.data) return;
    if (e.data.type === 'theme') {
      document.documentElement.setAttribute('data-theme', e.data.value);
      applyChartTheme();
    }
    if (e.data.type === 'search') {
      window.parent.postMessage({ type: 'searchResult', count: 0, total: 0 }, '*');
    }
  });
</script>
</body>
</html>
